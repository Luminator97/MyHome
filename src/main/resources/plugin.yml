name: MyHome
main: dev.treehouse.myhome.MyHomePlugin
version: ${version}
api-version: "1.21"
author: Luminator97
permissions:
  MyHome.admin:
    description: Allows managing others' homes, bypass limits, and reload
    default: op
commands:
  home:
    description: Home management
    usage: "/home <name | player:name | set|create|add <name> [--override] | rename|ren <old> <new> | delete|del|rem|remove <name> | invite|inv <home> <player> | uninvite|uninv <home> <player> | public|pub <home> | private|priv <home> | list <mine|public|invited> [page] | clear [confirm|<player>] | bed | admin <player> <set|rename|delete|invite|uninvite|public|private|list|clear> [args] | reload | help>"
    aliases: [homes]
